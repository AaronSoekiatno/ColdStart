services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coldstart-code-server
    ports:
      - "8080:8080"
    volumes:
      # Persist workspace data
      - workspace-data:/workspace
      # Optional: Mount local workspace for development
      # - ./starter-workspace:/workspace
    environment:
      - PASSWORD=
      - SUDO_PASSWORD=
      # Claude CLI API key - injected from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Supabase credentials for prompt logging
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # User identification for prompt logging
      - CANDIDATE_ID=${CANDIDATE_ID}
    restart: unless-stopped
    # Resource limits (optional, uncomment to enable)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G

volumes:
  workspace-data:
    driver: local
