# Generated docker-compose.yml for Helix instance: dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      
    image: helix-coldstart-dev:debug
    container_name: helix-coldstart-dev_app
    ports:
      - "6969:6969"
    volumes:
      - ../.volumes/dev:/data
    environment:
      - HELIX_PORT=6969
      - HELIX_DATA_DIR=/data
      - HELIX_INSTANCE=dev
      - HELIX_PROJECT=coldstart
    restart: unless-stopped
    networks:
      - helix-coldstart-dev_net

networks:
  helix-coldstart-dev_net:
    driver: bridge
