services:
  # Next.js Web App - Production Mode
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coldstart-web
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Makes host.docker.internal work on Linux/WSL
    environment:
      - NODE_ENV=production
    # Uses .env.local (preferred, gitignored)
    # If you use .env instead, change this to: - .env
    env_file:
      - .env.local
    restart: unless-stopped
    profiles:
      - production

  # Next.js Web App - Development Mode (with hot reload)
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coldstart-web-dev
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Makes host.docker.internal work on Linux/WSL
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true  # Enable polling for file changes
    # Uses .env.local (preferred, gitignored)
    # If you use .env instead, change this to: - .env
    env_file:
      - .env.local
    command: npm run dev
    restart: unless-stopped
    profiles:
      - dev
